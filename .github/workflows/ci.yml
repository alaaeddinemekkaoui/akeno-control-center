name: Build AKENO Control Center

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Akeno.ControlCenter.sln
      - name: Build
        run: dotnet build Akeno.ControlCenter.sln --configuration Release --no-restore
